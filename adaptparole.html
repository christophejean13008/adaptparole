<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Adaptparole — communiquer en GS avec la CAA</title>
<style>
:root{
  --ink:#1E2B36; --ink2:#51616D; --paper:#EAF0F2; --panel:#FFFFFF; --line:#C8D3D9;
  --accent:#2C6E8A; --accent-soft:#D6E8EF; --warn:#B4532A;
  --k-pers:#F4D35E; --k-verbe:#86C77A; --k-desc:#83B7E6; --k-nom:#F3A65A;
  --k-mot:#BFA2E8; --k-social:#F2A6C4; --k-quest:#AEB9C0; --k-prag:#FFFFFF;
  --tile:124px;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- barre du haut ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dots{display:inline-flex;gap:3px}
.brand .dots i{width:10px;height:22px;border-radius:3px;display:block}
.brand small{font-weight:600;color:var(--ink2);font-size:.9rem}
.tbtn{padding:8px 14px;border-radius:12px;background:var(--paper);font-weight:700;font-size:.95rem;position:relative;overflow:hidden;border:2px solid transparent}
.tbtn.on{background:var(--ink);color:#fff}
.hold .fill{position:absolute;inset:0;background:var(--accent-soft);transform:scaleX(0);transform-origin:left;z-index:0}
.hold span.lbl{position:relative;z-index:1}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1s linear}

/* ---------- vue élève ---------- */
#viewEleve{flex:1;display:flex;flex-direction:column;min-height:0}
.strip-wrap{display:flex;gap:10px;padding:10px 12px;align-items:stretch}
.strip{flex:1;min-height:92px;background:var(--panel);border:3px solid var(--ink);border-radius:18px;display:flex;align-items:center;gap:6px;padding:6px 10px;overflow-x:auto}
.strip.model{border-style:dashed;border-color:var(--accent);background:#F4FAFC}
.strip .empty{color:var(--ink2);font-size:.95rem;padding-left:6px}
.strip .chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;height:76px;border-radius:12px;padding:2px 6px;font-weight:700;font-size:.85rem;border-bottom:6px solid}
.strip .chip .em{font-size:30px;line-height:1.1}
.strip .chip img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.strip .said{margin-left:8px;font-size:1.25rem;font-weight:800;white-space:nowrap}
.strip-btns{display:flex;gap:8px}
.strip-btns button{width:78px;border-radius:18px;background:var(--panel);border:3px solid var(--line);font-size:1.6rem;font-weight:800}
.strip-btns .say{width:110px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:1.15rem}

.board{flex:1;display:grid;grid-template-columns:118px 1fr 132px;gap:10px;padding:0 12px 12px;min-height:0}
.ops{display:flex;flex-direction:column;gap:8px}
.ops button{flex:1;max-height:110px;border-radius:16px;background:var(--panel);border:3px solid var(--ink);font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.ops button .em{font-size:28px}
.page{background:var(--panel);border-radius:20px;padding:10px 12px 12px;overflow:auto;border:2px solid var(--line);position:relative}
.page h2{margin:0 0 8px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.page h2 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:10px}
.tile{aspect-ratio:1/1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:calc(var(--tile)*.13);text-align:center;padding:6px;border:2px solid rgba(0,0,0,.12);border-bottom-width:8px;position:relative;line-height:1.1}
.tile .em{font-size:calc(var(--tile)*.42);line-height:1}
.tile img{width:62%;height:62%;object-fit:cover;border-radius:10px}
.tile .go{position:absolute;top:6px;right:8px;font-size:.8rem;opacity:.7}
.tile:active,.tile.flash{transform:scale(.95)}
.tile.prag{background:#fff;border:3px solid var(--ink);border-bottom-width:8px}
.tabs{display:flex;flex-direction:column;gap:5px;overflow:auto}
.tabs button{text-align:left;padding:8px 10px;border-radius:12px 0 0 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px;border-left:8px solid;background:var(--panel);min-height:40px}
.tabs button.cur{margin-left:-10px;box-shadow:inset 0 0 0 3px var(--ink)}

/* couleurs de la clé */
.c-pers{--k:var(--k-pers)} .c-verbe{--k:var(--k-verbe)} .c-desc{--k:var(--k-desc)} .c-nom{--k:var(--k-nom)}
.c-mot{--k:var(--k-mot)} .c-social{--k:var(--k-social)} .c-quest{--k:var(--k-quest)} .c-prag{--k:var(--ink)}
.tile[class*="c-"]:not(.prag){background:color-mix(in srgb,var(--k) 38%,#fff);border-bottom-color:var(--k)}
.chip[class*="c-"]{background:color-mix(in srgb,var(--k) 38%,#fff);border-bottom-color:var(--k)}
.chip.c-prag{background:#fff;border:2px solid var(--ink);border-bottom-width:6px}
.tabs button[class*="c-"]{border-left-color:var(--k)}
.modelmode .tile{box-shadow:0 0 0 3px var(--accent)}

/* ---------- vue adulte ---------- */
#viewAdulte{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0;-webkit-user-select:text;user-select:text}
.anav{background:var(--panel);border-right:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.anav button{text-align:left;padding:10px 12px;border-radius:12px;font-weight:700}
.anav button.cur{background:var(--accent);color:#fff}
.acontent{overflow:auto;padding:22px 26px 60px}
.acontent h1{font-size:1.6rem;margin:0 0 6px;line-height:1.2}
.acontent h2{font-size:1.2rem;margin:28px 0 8px}
.acontent h3{font-size:1.02rem;margin:0 0 4px}
.lead{color:var(--ink2);max-width:70ch;margin:0 0 14px}
.prose{max-width:72ch}
.box{background:var(--panel);border-radius:16px;padding:14px 16px;border:2px solid var(--line);margin:10px 0}
.box.note{border-color:var(--warn);background:#FFF6F1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:12px 0 4px;max-width:900px}
.loop div{background:var(--panel);border:2px solid var(--line);padding:12px;position:relative;font-size:.95rem}
.loop div:first-child{border-radius:16px 0 0 16px}
.loop div:last-child{border-radius:0 16px 16px 0}
.loop div + div{border-left:0}
.loop b{display:block;font-size:1.05rem;margin-bottom:2px}
.loop .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:.85rem;margin-bottom:6px}
.do{color:#2D6B2A;font-weight:700}
.dont{color:var(--warn);font-weight:700}
.ex{background:var(--paper);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.95rem}
.ex .c{color:var(--ink2)}
table{border-collapse:collapse;width:100%;background:var(--panel);border-radius:14px;overflow:hidden;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
tr.target td{background:#FFF8DD}
.lvlbtn{padding:6px 12px;border-radius:10px;border:2px solid var(--line);font-weight:800;background:var(--panel)}
.lvlbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}
.btn.sec{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--warn);border:2px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.moment{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.moment .cnt{display:flex;align-items:center;gap:10px;margin:8px 0}
.moment .cnt button{width:52px;height:52px;border-radius:14px;background:var(--paper);font-size:1.6rem;font-weight:800}
.moment .cnt .v{font-size:1.8rem;font-weight:800;min-width:2ch;text-align:center}
.bar{height:10px;background:var(--paper);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--k-verbe)}
.moment ul{margin:6px 0 0;padding-left:18px;font-size:.92rem;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--ink2);font-size:.9rem}
.week{display:flex;gap:8px;align-items:flex-end;height:130px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.78rem;color:var(--ink2)}
.week .d i{width:70%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.week .d b{color:var(--ink);font-size:.8rem}
.selfcnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.selfcnt button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.selfcnt button b{font-size:1.5rem;display:block}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],select{font:inherit;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;min-width:220px}
.tourrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.tourrow input{flex:1;min-width:0;padding:7px 9px}
.tourrow.ok input{background:#F2FAF1;border-color:var(--k-verbe)}
.tourrow button{flex:0 0 auto}
.custlist{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.custlist .it{width:130px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-weight:700;font-size:.9rem}
.custlist img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.log{font-size:.92rem}
.src li{margin-bottom:6px}

/* ---------- panneau d'aide après une phrase ---------- */
.sheet{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 20px));background:var(--panel);border:3px solid var(--accent);border-radius:20px;padding:14px 16px;box-shadow:0 10px 40px rgba(20,40,55,.25);z-index:20;max-height:80vh;overflow:auto;-webkit-user-select:text;user-select:text}
.sheet h3{margin:0 0 6px;font-size:1rem;color:var(--accent)}
.sheet .prod{font-size:1.2rem;font-weight:800}
.sheet .resp{font-size:1.15rem;font-weight:800;margin:2px 0}
.sheet .tip{color:var(--ink2);font-size:.92rem}
.sheet .grp{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{padding:7px 12px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:.92rem;background:#fff}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .speak{font-size:1rem;padding:2px 8px;border-radius:8px;background:var(--accent-soft);margin-left:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}

/* ---------- attente ---------- */
.overlay{position:fixed;inset:0;background:rgba(234,240,242,.94);z-index:30;display:grid;place-items:center;text-align:center}
.ring{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;font-size:4rem;font-weight:800;background:conic-gradient(var(--accent) var(--p,100%),#fff 0);margin:0 auto 14px}
.ring span{width:180px;height:180px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.overlay p{max-width:32ch;margin:0 auto 14px;font-size:1.1rem}
.ai{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 8px;border-radius:999px;background:#E7E0F7;color:#4B3A80;margin-left:6px;vertical-align:middle}
.aiwait{color:var(--ink2);font-size:.9rem;font-style:italic}
textarea.oral{width:100%;font:inherit;font-size:1.15rem;padding:10px;border-radius:12px;border:2px solid var(--line);min-height:70px}
.synth{white-space:pre-wrap;max-width:72ch}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .board{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .ops{flex-direction:row;overflow-x:auto}
  .ops button{min-width:84px;max-height:none;height:70px;flex:0 0 auto}
  .tabs{flex-direction:row;overflow-x:auto}
  .tabs button{border-radius:12px;border-left-width:0;border-top:6px solid;border-top-color:var(--k);flex:0 0 auto}
  .tabs button.cur{margin:0}
  .strip-btns button{width:56px}.strip-btns .say{width:80px}
  #viewAdulte{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .anav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line)}
  .anav button{flex:0 0 auto}
  .loop{grid-template-columns:1fr 1fr}
  .loop div{border-radius:0!important;border-left:2px solid var(--line)!important}
  .sgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.anav,#viewEleve,.noprint{display:none!important}
  #viewAdulte{display:block!important}
  body{background:#fff}
  body.printing > *{display:none!important}
  body.printing #printout{display:block!important}
  @page{size:A4;margin:8mm}
  .psheet{page-break-after:always;break-after:page}
  .psheet:last-child{page-break-after:auto}
}
#printout{display:none}
.psheet{background:#fff;color:#000;padding:2mm 0 4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.phead{display:flex;align-items:center;gap:4mm;border-bottom:1.2mm solid var(--k);padding-bottom:2mm;margin-bottom:3mm}
.phead b{font-size:6mm}
.phead .pnum{margin-left:auto;font-size:4mm;color:#444}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,var(--ps));gap:3mm;justify-content:start}
.pcard{width:var(--ps);height:var(--ps);border:0.6mm solid #999;border-bottom:2mm solid var(--k);border-radius:3mm;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1mm;
  font-weight:700;font-size:calc(var(--ps)*.13);line-height:1.1;background:#fff;overflow:hidden}
.pcard .em{font-size:calc(var(--ps)*.42);line-height:1}
.pcard img{width:60%;height:60%;object-fit:cover;border-radius:2mm}
.pcard .pgo{font-size:calc(var(--ps)*.10);color:#333;font-weight:800}
.pops{display:flex;gap:3mm;margin-top:4mm;border-top:0.4mm dashed #999;padding-top:3mm}
.pops div{flex:1;border:0.6mm solid #000;border-radius:3mm;padding:2mm 1mm;text-align:center;font-weight:800;font-size:3.4mm}
.pfoot{margin-top:3mm;font-size:3.2mm;color:#555;display:flex;justify-content:space-between}
.apercu{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;overflow:auto;max-height:70vh}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.92rem}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dots" aria-hidden="true"><i style="background:var(--k-pers)"></i><i style="background:var(--k-verbe)"></i><i style="background:var(--k-desc)"></i><i style="background:var(--k-nom)"></i></span>
    Adaptparole <small id="who"></small>
  </div>
  <button class="tbtn" id="btnWait" title="Minuteur d'attente active">⏳ J'attends</button>
  <button class="tbtn" id="btnOral" title="Noter une phrase dite à l'oral">💬 Il a dit…</button>
  <button class="tbtn" id="btnModel" title="L'adulte montre les pictos en parlant">✋ Je modélise</button>
  <button class="tbtn hold" id="btnAdult"><span class="fill"></span><span class="lbl">Espace adulte</span></button>
  <button class="tbtn" id="btnBoard" hidden>← Tableau de l'élève</button>
</header>

<!-- ================= VUE ÉLÈVE ================= -->
<section id="viewEleve">
  <div class="strip-wrap">
    <div id="strip" class="strip" aria-live="polite"></div>
    <div class="strip-btns">
      <button class="say" id="bSay">🔊 Dire</button>
      <button id="bBack" aria-label="Effacer le dernier picto">⌫</button>
      <button id="bClear" aria-label="Tout effacer">✕</button>
    </div>
  </div>
  <div class="board">
    <nav class="ops" aria-label="Boutons de conduite">
      <button id="oHome"><span class="em">🏠</span>Début</button>
      <button id="oPrev"><span class="em">↩️</span>Page d'avant</button>
      <button id="oOups"><span class="em">🙊</span>Oups, erreur</button>
      <button id="oNoWord"><span class="em">🤔</span>Pas le mot</button>
      <button id="oOther"><span class="em">🔀</span>Autre chose</button>
    </nav>
    <div class="page" id="pageBox">
      <h2 id="pageTitle"></h2>
      <div id="grid" class="grid"></div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Pages du tableau"></nav>
  </div>
</section>

<!-- ================= VUE ADULTE ================= -->
<section id="viewAdulte" hidden>
  <nav class="anav" id="anav">
    <button data-sec="posture">Se positionner</button>
    <button data-sec="progression">Progression</button>
    <button data-sec="occasions">Occasions du jour</button>
    <button data-sec="suivi">Suivi</button>
    <button data-sec="photos">Mes pictos photo</button>
    <button data-sec="impression">Imprimer le classeur</button>
    <button data-sec="reglages">Réglages</button>
    <button data-sec="sources">Sources</button>
  </nav>
  <div class="acontent" id="acontent"></div>
</section>

<!-- panneau d'aide à l'adulte -->
<div id="sheet" class="sheet" hidden></div>

<!-- minuteur d'attente -->
<div id="waitOv" class="overlay" hidden>
  <div>
    <div class="ring" id="ring"><span id="ringN">7</span></div>
    <p><b>J'attends, je regarde l'enfant.</b><br>Je ne répète pas la question. Je garde le tableau à sa portée.</p>
    <button class="btn" id="waitStop">L'enfant a communiqué</button>
    <button class="btn sec" id="waitEnd">Fermer</button>
  </div>
</div>
<div id="printout"></div>
<div id="toast"></div>

<script id="logic">
/* =====================================================================
   DONNÉES : vocabulaire codé couleur (clé de Fitzgerald modifiée)
   ===================================================================== */
const W = {};
function add(c, list){ list.forEach(o => { o.c = c; W[o.id] = o; }); }

// Personnes (jaune)
add('pers', [
  {id:'je', t:'je', e:'🙋', pron:'je'},
  {id:'tu', t:'tu', e:'👉', pron:'tu'},
  {id:'il', t:'il', e:'👦', pron:'il'},
  {id:'elle', t:'elle', e:'👧', pron:'il'},
  {id:'on', t:'on', e:'👫', pron:'il'},
  {id:'maitresse', t:'la maîtresse', e:'👩‍🏫'},
  {id:'maitre', t:'le maître', e:'👨‍🏫'},
  {id:'aesh', t:"l'AESH", e:'🧑'},
  {id:'copain', t:'le copain', e:'🧒'},
  {id:'copine', t:'la copine', e:'👱‍♀️'},
  {id:'maman', t:'maman', e:'👩'},
  {id:'papa', t:'papa', e:'👨'},
]);

// Actions (vert) : f = [je, tu, il/elle/on]
add('verbe', [
  {id:'vouloir', t:'vouloir', e:'🙋‍♂️', f:['veux','veux','veut'], modal:1},
  {id:'aller', t:'aller', e:'➡️', f:['vais','vas','va'], modal:1, lieu:'dans la cour'},

/* =====================================================================
   LANGUE : rendu d'une production, reformulation et +1
   ===================================================================== */
const P = {je:0, tu:1, il:2};
const conj = (v,p) => v.f ? v.f[P[p]] : v.t;
const SWAP = {je:['tu','tu'], tu:['je','je'], il:['il','il']};
function art(n){ if(!n || n.noArt) return ''; return n.g==='p' ? 'les' : n.g==='f' ? 'la' : 'le'; }
function NP(n, adj){
  if(!n) return '';
  const a = art(n);
  if(!adj) return [a, n.t].join(' ');
  return adj[1] ? [a, adj[0], n.t].join(' ') : [a, n.t, adj[0]].join(' ');
}
function joinFr(parts){
  let s = parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  s = s.replace(/(^|\s)de le\s/gi,'$1du ').replace(/(^|\s)de les\s/gi,'$1des ')
       .replace(/(^|\s)à le\s/gi,'$1au ').replace(/(^|\s)à les\s/gi,'$1aux ');
  s = s.replace(/(^|\s)(je|le|la|ne|de|que)\s+(?=[aeiouyhàâéèêëîïôûù])/gi, (m,sp,w) => sp + w.slice(0,-1) + "'");
  return s;
}
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// Texte de la production telle que l'enfant l'a construite (conjugaison automatique, pas d'ajout d'articles)
function textOf(ids){
  const out=[]; let subj=null;
  ids.forEach((id,i) => {
    const w=W[id]; if(!w) return;
    const prev = i>0 ? W[ids[i-1]] : null;
    if(w.pron && !w.f){ subj=w.pron; out.push(w.t); return; }
    if(w.c==='pers'){ subj='il'; out.push(w.t); return; }
    if(w.c==='prag'){ if(w.pron) subj=w.pron; out.push(w.t); return; }
    if(w.c==='verbe'){
      if(prev && prev.modal) out.push(w.t);
      else if(subj) out.push(conj(w,subj));
      else out.push(w.t);
      return;
    }
    if(w.c==='nom'){ if(!subj && !ids.slice(0,i).some(x=>W[x]&&W[x].c==='verbe')) subj='il'; out.push(w.t); return; }
    out.push(w.t);
  });
  return joinFr(out);
}

// Analyse simple de la production → réponse de l'adulte (reformulation) et suggestion « +1 »
function respond(ids){
  const ws = ids.map(id=>W[id]).filter(Boolean);
  let subj=null, modal=null, verb=null, obj=null, place=null, pending=null;
  const adjs=[], conns=[], socials=[], emos=[];
  let lastPrep=null;
  ws.forEach(w => {
    if(w.c==='pers'){
      const s = w.pron ? {txt:SWAP[w.pron][0], p:SWAP[w.pron][1]} : {txt:w.t, p:'il'};
      if(!subj && !verb && !modal) subj=s;
      else if(!obj) obj={pers:w};
      return;
    }
    if(w.c==='prag'){ if(w.modal){ subj={txt:SWAP[w.pron][0],p:SWAP[w.pron][1]}; modal=w; } return; }
    if(w.c==='verbe'){ if(w.modal && !modal && !verb) modal=w; else if(!verb) verb=w; return; }
    if(w.c==='nom'){
      if(lastPrep){ place={prep:lastPrep, noun:w}; lastPrep=null; return; }
      if(!verb && !modal && !subj && !pending){ pending=w; return; }
      if(!obj){ obj={noun:w}; return; }
      return;
    }
    if(w.c==='mot'){ if(w.prep){ lastPrep=w; } else if(w.conn) conns.push(w); return; }
    if(w.c==='desc'){ if(w.emo) emos.push(w); else adjs.push(w); return; }
    if(w.c==='social') socials.push(w);
  });
  if(lastPrep && !place) place={prep:lastPrep, noun:null};

  // Nom isolé avant le verbe : sujet ou objet ?
  let subjNoun=null;
  if(pending){
    if(verb){
      if(verb.intr || verb.id===pending.hv && pending.suj) subjNoun=pending;
      else if(!obj) obj={noun:pending};
    } else if(modal){ if(!obj) obj={noun:pending}; }
  }

  const hasContent = pending||verb||modal||obj||place||adjs.length||emos.length||subj;
  const fn = guessFn(ids);
  if(!hasContent){
    return {reform:null, plus:null,
      tip: fn==='refuser' ? "Respectez le refus, nommez-le en montrant les pictos : « Tu ne veux pas. Stop. »"
         : fn==='questionner' ? "Répondez à la question en pointant les pictos de votre réponse."
         : "Répondez d'abord à ce que l'enfant demande, puis modélisez une phrase de 2 pictos en parlant."};
  }

  // Émotion seule ou « être » + émotion
  if(emos.length && !pending && !obj){
    const who = subj || {txt:'tu', p:'tu'};
    const base = [who.txt, conj(W.etre, who.p), emos[0].t];
    return {reform:cap(joinFr(['oui,'].concat(base)))+'.',
            plus:cap(joinFr(base))+' parce que… ?',
            tip:"Nommez l'émotion, puis ouvrez vers la cause avec « parce que ». Laissez l'enfant compléter."};
  }

  // Adjectif demandé par l'enfant : on l'accroche au nom le plus proche
  const tgtNoun = (obj&&obj.noun) || subjNoun || (place&&place.noun) || (!verb&&!modal?pending:null);
  const childAdj = adjs.find(a=>!a.adv);
  const adv = adjs.find(a=>a.adv);
  const adjOf = n => (childAdj && n===tgtNoun) ? [childAdj.t, !!childAdj.pre] : null;

  function sentence(o){
    const parts=[];
    if(o.subjNoun) parts.push(NP(o.subjNoun, o.adjFor===o.subjNoun?o.adj:null));
    else if(o.subj) parts.push(o.subj.txt);
    const p = o.subjNoun ? 'il' : o.subj ? o.subj.p : 'tu';
    if(o.modal) parts.push(conj(o.modal,p) + (o.verb?' '+o.verb.t:''));
    else if(o.verb) parts.push(conj(o.verb,p));
    if(o.obj){ if(o.obj.pers) parts.push(o.obj.pers.t); else parts.push(NP(o.obj.noun, o.adjFor===o.obj.noun?o.adj:null)); }
    if(o.extra) parts.push(o.extra);
    if(o.adv) parts.push(o.adv);
    if(o.place) parts.push(o.place.prep.t, o.place.noun ? NP(o.place.noun, o.adjFor===o.place.noun?o.adj:null) : '');
    if(o.placeTxt) parts.push(o.placeTxt);
    return joinFr(parts);
  }

  // ---- Cas sans verbe : un nom (avec éventuellement « encore », un adjectif…) ----
  if(!verb && !modal){
    const n = pending || (obj&&obj.noun) || (place&&place.noun);
    const pre = socials.some(s=>s.id==='encore') ? 'encore' : 'oui,';
    if(!n){
      const a = childAdj || adv;
      return {reform:cap(joinFr([pre,"c'est",a?a.t:'']))+' !', plus:null,
        tip:"Montrez la chose dont parle l'enfant et nommez-la avec le mot qu'il a choisi."};
    }
    let np = NP(n, adjOf(n));
    if(pre==='encore') np = np.replace(/^les /,'des ').replace(/^le /,'du ').replace(/^la /,'de la ');
    const reform = cap(joinFr([pre, place?place.prep.t:'', np]))+' !';
    const v = n.hv ? W[n.hv] : null;
    let plus=null;
    if(v){
      plus = n.suj ? cap(sentence({subjNoun:n, verb:v, adj:adjOf(n), adjFor:n, extra:v.intr?v.plus:''}))+' !'
                   : cap(sentence({subj:{txt:'tu',p:'tu'}, verb:v, obj:{noun:n}, adj:adjOf(n), adjFor:n}))+' !';
    } else if(n.adj && !childAdj){
      plus = cap(joinFr(['oui,', NP(n, n.adj)]))+' !';
    }
    return {reform, plus, tip:"Nom seul → ajoutez un mot d'action. Montrez le picto « action » pendant que vous le dites."};
  }

  // ---- Cas avec verbe ----
  const base = {subj: subjNoun?null:(subj||{txt:'tu',p:'tu'}), subjNoun, modal, verb, obj, place,
                adj: tgtNoun?adjOf(tgtNoun):null, adjFor:tgtNoun, adv: adv?adv.t:''};
  const reform = cap(joinFr(['oui,', sentence(base)]))+' !';

  const nx = Object.assign({}, base);
  let tip='';
  const v = verb || null;
  const nounHere = (obj&&obj.noun) || subjNoun || (place&&place.noun);
  if(!subj && !subjNoun && ws.filter(w=>w.c!=='social').length<=1){
    // l'enfant a produit un verbe seul : la reformulation ajoute déjà le sujet
    if(v && v.plus && !v.intr){ nx.extra=v.plus; tip="Verbe seul → votre modèle ajoute « qui » et « quoi »."; }
    else { tip="Verbe seul → votre modèle ajoute « qui » fait l'action."; }
  } else if(!obj && !place && v && v.plus && !v.intr){
    nx.extra=v.plus; tip="Ajoutez « quoi » : le complément de l'action.";
  } else if(!obj && !place && modal && !v){
    nx.extra='ça'; tip="Montrez ce que l'enfant veut et nommez-le.";
  } else if(nounHere && !childAdj && nounHere.adj){
    nx.adj=nounHere.adj; nx.adjFor=nounHere; tip="Ajoutez un mot qui décrit (taille, couleur…).";
  } else if(!place && v && (v.lieu || (v.intr && v.plus))){
    if(v.lieu) nx.placeTxt=v.lieu; else nx.extra=v.plus;
    tip="Ajoutez « où » ou « comment ».";
  } else if(!conns.length){
    return {reform, plus:cap(reform.replace(/^Oui, /,'').replace(/ !$/,''))+' parce que… ?', tip:"Phrase déjà riche → ouvrez vers « parce que » ou « et après ? » sans exiger de réponse."};
  } else {
    return {reform, plus:null, tip:"Très belle phrase : reprenez-la telle quelle, avec enthousiasme."};
  }
  const plus = cap(joinFr([sentence(nx)]))+' !';
  return {reform, plus: plus===reform.replace(/^Oui, /,'').replace(/^./,c=>c.toUpperCase()) ? null : plus, tip};
}

function guessFn(ids){
  const has = x => ids.includes(x);
  const fnOf = ids.map(id=>W[id]&&W[id].fn).filter(Boolean);
  if(has('non')||has('stop')||has('p_nonveux')||has('p_arrete')||(has('pas'))) return 'refuser';
  if(ids.some(id=>W[id]&&W[id].c==='quest')||has('p_question')) return 'questionner';
  if(has('vouloir')||has('encore')||has('stp')||has('amoi')) return 'demander';
  if(fnOf.length) return fnOf[0];
  if(ids.every(id=>W[id]&&W[id].c==='social')) return 'social';
  return 'commenter';
}

// nombre d'éléments (pictos) d'une production
const lenOf = ids => ids.length;

/* ---------- Albert (IA de l'État) via le relais Cloudflare ---------- */
const iaDispo = () => settings.albert && !!settings.relais && navigator.onLine;
async function appelAlbert(systeme, demande, enJson=true, maxTok=500){
  let derniere=null;
  for(const modele of MODELES_ALBERT){
    const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 15000);
    try{
      const rep = await fetch(settings.relais, {method:'POST', headers:{'Content-Type':'application/json'}, signal:ctrl.signal,
        body: JSON.stringify({model:modele, max_tokens:maxTok, temperature:0.2,
          messages:[{role:'system',content:systeme},{role:'user',content:demande}]})});
      clearTimeout(t);
      if(rep.status===403) throw new Error('origine refusée par le relais');
      if(rep.status===429) throw new Error('trop de demandes, réessayez dans un instant');
      if(rep.status===502) throw new Error("le relais n'atteint pas Albert");
      if(!rep.ok) throw new Error('le relais a répondu '+rep.status);
      const d = await rep.json();
      const txt = (((d.choices||[])[0]||{}).message||{}).content||'';
      if(!enJson) return txt.trim();
      const a=txt.indexOf('{'), b=txt.lastIndexOf('}');
      if(a<0||b<0) throw new Error('réponse illisible');
      return JSON.parse(txt.slice(a,b+1));
    }catch(e){
      clearTimeout(t); derniere = e.name==='AbortError' ? new Error('Albert trop lent') : e;
      if(/origine|trop de demandes|n'atteint pas/.test(derniere.message)) throw derniere;
    }
  }
  throw derniere || new Error("le relais n'a pas répondu");
}
const SYS_REPONSE = `Tu es orthophoniste, spécialiste de la CAA (PODD) et de l'Enhanced Milieu Teaching auprès d'enfants autistes de 5-6 ans en grande section de maternelle.
On te donne une production d'un enfant (pictos touchés sur son tableau de communication, ou paroles dites à l'oral) et le niveau syntaxique visé.
Tu proposes ce que l'adulte (AESH ou enseignant) peut répondre à l'enfant :
- "reformulation" : la même intention, en français correct, adressée à l'enfant (je devient tu), très courte, commençant par « Oui, » sauf refus ou question. Ne jamais corriger ni demander de répéter.
- "plus1" : la reformulation enrichie d'UN SEUL élément de plus (sujet, action, complément, mot qui décrit, lieu, ou « parce que »), vraisemblable dans une classe de maternelle.
- "conseil" : une phrase courte pour l'adulte (quel picto pointer en parlant, quoi attendre).
- "fonction" : un mot parmi demander, commenter, refuser, choisir, raconter, questionner, social.
Si l'enfant refuse, respecte le refus. Si c'est une écholalie, réponds à l'intention probable.
Tu réponds uniquement par un objet JSON valide, sans aucun texte autour, sans balises de code.`;
async function reponseAlbert(txt, ids, oral){
  const detail = ids.length ? '\nPictos touchés, dans l\'ordre : '+ids.map(id=>W[id]?W[id].t:'').join(' | ') : '';
  const niv = LEVELS.find(l=>l.n===Math.min(7,settings.niveau+1));
  const demande = `Production ${oral?'dite à l\'oral':'faite sur le tableau'} : « ${txt} »${detail}
Niveau syntaxique visé : ${niv.n} (${niv.syn}, exemple : ${niv.ex}).`;
  const j = await appelAlbert(SYS_REPONSE, demande, true, 400);
  if(!j.reformulation) throw new Error('réponse incomplète');
  return {reform:j.reformulation, plus:j.plus1||null, tip:j.conseil||'', fn:(FNS.find(f=>f[0]===j.fonction)||[null])[0], src:'albert'};
}

/* ---------- panneau d'aide à l'adulte ---------- */
const TYPES = [['spont','Spontané (il initie)'],['solli','Réponse à une sollicitation'],['imit','Imitation / écholalie']];
const FNS = [['demander','Demander'],['commenter','Commenter'],['refuser','Refuser'],['choisir','Choisir'],['raconter','Raconter'],['questionner','Questionner'],['social','Saluer / social']];
function openSheet(ids, txt, oral=false){
  let r = oral ? {reform:null, plus:null, tip:"Sans réseau : reprenez sa phrase correctement, puis ajoutez un seul élément (qui, quoi, où, comment)."} : respond(ids);
  let type='spont', fn=oral?'commenter':guessFn(ids), enrichi=true, iaEtat='';
  const nb = oral ? txt.split(/\s+/).filter(Boolean).length : lenOf(ids);
  const sh=$('#sheet');
  const draw = () => {
    sh.innerHTML = `
      <div class="row" style="justify-content:space-between"><h3>Pour l'adulte · ${nb} ${oral?'mot':'picto'}${nb>1?'s':''}${oral?' à l\'oral':''}${r.src==='albert'?'<span class="ai">✨ Albert</span>':''}</h3>
        <button class="pill noprint" id="shClose">Fermer</button></div>
      <div class="prod">« ${txt} »</div>
      ${iaEtat?`<div class="aiwait">${iaEtat}</div>`:''}
      <div class="sgrid">
        <div class="box" style="margin:0"><h3>1. J'accueille et je reformule</h3>
          ${r.reform?`<div class="resp">« ${r.reform} »<button class="speak" data-say="${r.reform}">🔊</button></div>`:''}
          <div class="tip">${r.reform?'Même intention, forme correcte. Ne demandez pas de répéter.':r.tip}</div></div>
        <div class="box" style="margin:0"><h3>2. J'enrichis de +1</h3>
          ${r.plus?`<div class="resp">« ${r.plus} »<button class="speak" data-say="${r.plus}">🔊</button></div>`:''}
          <div class="tip">${r.reform?r.tip:'—'} Suggestion à adapter à ce que l'enfant veut vraiment dire.</div></div>
      </div>
      <h3>Comment est venue cette phrase ?</h3>
      <div class="grp">${TYPES.map(([k,l])=>`<button class="pill ${k===type?'on':''}" data-type="${k}">${l}</button>`).join('')}</div>
      <h3>À quoi elle sert ?</h3>
      <div class="grp">${FNS.map(([k,l])=>`<button class="pill ${k===fn?'on':''}" data-fn="${k}">${l}</button>`).join('')}</div>
      <div class="row" style="margin-top:8px">
        <button class="pill ${enrichi?'on':''}" id="shEnr">J'ai répondu en enrichissant</button>
        <button class="btn" id="shSave">Noter dans le suivi</button>
        <button class="btn sec" id="shWait">⏳ Attendre d'abord</button>
      </div>`;
  };
  draw(); sh.hidden=false;
  if(iaDispo()){
    iaEtat='Albert prépare une réponse plus fine…'; draw();

      if(sh._jeton!==jeton) return;
      r=a; if(a.fn) fn=a.fn; iaEtat=''; draw();
    }).catch(e=>{ if(sh._jeton!==jeton) return; iaEtat='Albert indisponible ('+e.message+') : suggestion faite sur l\'appareil.'; draw(); });
  } else if(oral){ iaEtat = settings.albert ? 'Pas de réseau : Albert est indisponible.' : ''; draw(); }
  sh.onclick = e => {
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.say){ speak(t.dataset.say); return; }
    if(t.dataset.type){ type=t.dataset.type; draw(); return; }
    if(t.dataset.fn){ fn=t.dataset.fn; draw(); return; }
    if(t.id==='shEnr'){ enrichi=!enrichi; draw(); return; }
    if(t.id==='shClose'){ sh.hidden=true; return; }

const MOMENTS = [
  {k:'habillage', t:'Habillage', ideas:['Donner une seule chaussure, attendre.','Commenter : « Tu mets le manteau. »','Verbes cibles : mettre, enlever, fermer, ouvrir.']},

  <h2>À propos du PODD</h2>

}

function ratioMsg(a){
  if(!a.comment && !a.question) return '';
  if(a.question===0) return 'Que des commentaires pour l\'instant : très bien.';
  const r=(a.comment/a.question);
  return r>=3 ? `Environ ${r.toFixed(1)} commentaires pour une question : bon équilibre.`
               : `Environ ${r.toFixed(1)} commentaire(s) pour une question : essayez de commenter davantage.`;
}

function secSuivi(c){
  const d=today();
  const child = logData.filter(x=>x.type!=='modele');
  const td = child.filter(x=>x.d===d);
  const mean = arr => arr.length ? (arr.reduce((a,x)=>a+x.n,0)/arr.length) : 0;
  const pct = (arr,t) => arr.length ? Math.round(arr.filter(x=>x.type===t).length/arr.length*100) : 0;
  const days=[]; for(let i=6;i>=0;i--){ const x=new Date(); x.setDate(x.getDate()-i); const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); days.push(k); }
  const perDay = days.map(k=>{ const a=child.filter(x=>x.d===k); return {k, n:a.length, m:mean(a)}; });
  const maxN = Math.max(1,...perDay.map(p=>p.n));
  const fnCount = FNS.map(([k,l])=>[l, td.filter(x=>x.fn===k).length]).filter(x=>x[1]);
  const modeles = logData.filter(x=>x.type==='modele'&&x.d===d).length;
  c.innerHTML = `
  <h1>Suivi ${settings.prenom?'de '+settings.prenom:''}</h1>
  <p class="lead">On regarde surtout si les productions <b>spontanées</b> augmentent et s'allongent, dans des situations variées, plutôt que la réussite à un exercice.</p>
  <div class="stats">
    <div class="stat"><b>${td.length}</b><span>productions notées aujourd'hui</span></div>
    <div class="stat"><b>${mean(td).toFixed(1)}</b><span>pictos par production (moyenne)</span></div>
    <div class="stat"><b>${pct(td,'spont')} %</b><span>initiatives spontanées</span></div>
    <div class="stat"><b>${modeles}</b><span>modèles de l'adulte notés</span></div>
  </div>
  <h2>7 derniers jours</h2>
  <div class="week">${perDay.map(p=>`<div class="d"><b>${p.n||''}</b><i style="height:${p.n/maxN*80}%"></i>${p.k.slice(8)}/${p.k.slice(5,7)}<br>${p.n?p.m.toFixed(1)+' p.':''}</div>`).join('')}</div>
  <p class="lead" style="margin-top:6px">Hauteur : nombre de productions. Sous la barre : longueur moyenne en pictos.</p>
  ${fnCount.length?`<h2>Fonctions aujourd'hui</h2><p>${fnCount.map(([l,n])=>`${l} : <b>${n}</b>`).join(' · ')}</p>`:''}
  <h2>Productions notées aujourd'hui</h2>
  ${td.length?`<table class="log"><tr><th>Heure</th><th>Production</th><th>Pictos</th><th>Venue</th><th>Fonction</th></tr>
    ${td.slice().reverse().map(x=>`<tr><td>${x.h}</td><td>${x.txt}</td><td>${x.n}</td><td>${(TYPES.find(t=>t[0]===x.type)||['',''])[1]}</td><td>${(FNS.find(f=>f[0]===x.fn)||['',''])[1]}</td></tr>`).join('')}</table>`
    :'<p class="lead">Rien de noté aujourd\'hui. Après « 🔊 Dire », le panneau pour l\'adulte propose « Noter dans le suivi ».</p>'}
  <div class="row noprint" style="margin-top:16px">
    <button class="btn" id="copyB">Copier le bilan</button>
    <button class="btn sec" onclick="window.print()">Imprimer</button>
    <button class="btn danger" id="resetB">Effacer tout le suivi</button>
  </div>
  <h2>Synthèse de la semaine</h2>
  <div class="row noprint"><button class="btn" id="synB" ${iaDispo()?'':'disabled'}>✨ Rédiger la synthèse avec Albert</button>
    <span class="c">${iaDispo()?'Pour l\'équipe éducative ou l\'orthophoniste. Le prénom n\'est pas envoyé.':'Nécessite le réseau et Albert activé (Réglages).'}</span></div>
  <div class="box synth" id="synT" ${c._synth?'':'hidden'}>${c._synth||''}</div>`;
  $('#copyB').onclick=()=>{
    const t = `Adaptparole — bilan du ${d.split('-').reverse().join('/')}${settings.prenom?' — '+settings.prenom:''}
Productions : ${td.length} · longueur moyenne : ${mean(td).toFixed(1)} pictos · spontanées : ${pct(td,'spont')} %
Modèles de l'adulte : ${modeles}
${td.map(x=>`${x.h}  ${x.txt}  (${x.n})`).join('\n')}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Bilan copié')).catch(()=>toast('Copie impossible sur cet appareil'));
  };
  $('#synB').onclick=async()=>{
    const semaine = logData.filter(x=>days.includes(x.d));
    if(!semaine.length){ toast('Aucune production notée cette semaine'); return; }
    const lignes = semaine.map(x=>`${x.d} ${x.h} | ${x.type==='modele'?'MODÈLE ADULTE':(TYPES.find(t=>t[0]===x.type)||['',''])[1]} | ${x.oral?'oral':'tableau'} | ${x.n} éléments | ${x.fn} | ${x.txt}`).join('\n');
    const ad = days.map(k=>counters[k]).filter(Boolean).reduce((s,c)=>{ for(const k in c.ad) s[k]=(s[k]||0)+c.ad[k]; return s; },{});
    const box=$('#synT'); box.hidden=false; box.textContent='Albert rédige la synthèse…';
    try{
      const t = await appelAlbert(`Tu es orthophoniste spécialiste de la CAA (PODD) et des interventions naturalistes auprès d'enfants autistes de maternelle. Tu rédiges une synthèse factuelle de 150 à 220 mots, en français, pour l'équipe éducative : évolution de la longueur des productions, part des initiatives spontanées, diversité des fonctions de communication, usage du tableau et de l'oral, gestes des adultes (modélisations, reformulations, attentes, rapport commentaires/questions). Termine par deux pistes concrètes pour la semaine suivante et le niveau syntaxique à viser. Aucun diagnostic, aucun jugement sur l'enfant, pas de titre, pas de liste à puces, pas de markdown.`,
        `Niveau actuel choisi par l'équipe : ${settings.niveau} (${LEVELS[settings.niveau-1].syn}).\nGestes des adultes sur la semaine : ${JSON.stringify(ad)}\nProductions de la semaine :\n${lignes}`, false, 700);
      c._synth = t.replace(/[*#]/g,''); box.textContent = c._synth;
    }catch(e){ box.textContent = 'Synthèse impossible : '+e.message+'.'; }
  };
  $('#resetB').onclick=()=>{ if(confirm('Effacer toutes les productions et tous les compteurs ?')){ logData=[]; counters={}; save('log',logData); save('cnt',counters); secSuivi(c); } };
}

  </div>
  <input type="file" id="tourF" accept="image/*" hidden>
  <h2>Pictos déjà créés</h2>
  ${custom.length?'':'<p class="lead">Aucun pour l\'instant.</p>'}
  <div class="custlist">${custom.slice().sort((a,b)=>(b.prio?1:0)-(a.prio?1:0)).map(x=>`<div class="it"><img src="${x.img}" alt=""><div>${x.t}${x.prio?' <span class="c">·&nbsp;tour</span>':''}</div><button class="pill" data-del="${x.id}">Supprimer</button></div>`).join('')}</div>`;

  let img=null;
  const photo = (f, apres) => {
    const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const s=240, cv=document.createElement('canvas'); cv.width=cv.height=s; const x=cv.getContext('2d');
      const m=Math.min(im.width,im.height); x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
      apres(cv.toDataURL('image/jpeg',0.75));
    }; im.src=r.result; }; r.readAsDataURL(f);
  };

  $('#cC').onchange=()=>{ $('#gBox').hidden = $('#cC').value!=='nom'; };
  $('#cF').onchange=e=>{ const f=e.target.files[0]; if(f) photo(f, d=>{ img=d; $('#cPrev').innerHTML=`<img src="${img}" style="width:120px;border-radius:12px">`; }); };
  $('#cAdd').onclick=()=>{
    const t=$('#cT').value.trim(); if(!t){ toast('Écrivez le mot'); return; } if(!img){ toast('Choisissez une photo'); return; }
    custom.push({id:'c_'+Date.now(), t, cls:$('#cC').value, g:$('#cG').value, page:$('#cP').value, img});
    save('custom',custom); registerCustom(); toast('Picto ajouté'); secPhotos(c);
  };

  // tour de l'école : une photo par ligne, ajoutée en tête de sa page
  const champ = $('#tourF');
  c.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{
    const [k,i] = b.dataset.shot.split(':');
    const saisie = c.querySelector(`[data-t="${k}:${i}"]`);
    const t = saisie.value.trim();
    if(!t){ toast('Écrivez le mot avant la photo'); return; }
    const g = i==='libre' ? (/^les |^mes /i.test(t)?'p':/^la |^l'/i.test(t)?'f':'m') : TOUR[k].items[+i][1];
    champ.value='';
    champ.onchange = e => { const f=e.target.files[0]; if(!f) return;
      photo(f, d=>{
        custom = custom.filter(x=>x.t.toLowerCase()!==t.toLowerCase());
        custom.unshift({id:'c_'+Date.now(), t, cls:'nom', g, page:TOUR[k].page, img:d, prio:1});
        save('custom',custom); registerCustom(); toast(t+' : picto ajouté'); secPhotos(c);
      });
    };
    champ.click();
  });

  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ custom=custom.filter(x=>x.id!==b.dataset.del); save('custom',custom); registerCustom(); secPhotos(c); });
}

const OPS_PRINT = ['🏠 Début','↩️ Page d\'avant','🙊 Oups, erreur','🤔 Pas le mot','🔀 Autre chose'];

function feuilles(){
  const I = settings.imp;
  const choisies = I.pages || PAGES.filter(p=>p.id!=='photos'||custom.length).map(p=>p.id);
  const pages = PAGES.filter(p=>choisies.includes(p.id) && p.items.length);
  return pages.map((p,i) => {
    const cartes = p.items.map(id=>{ const w=W[id]; if(!w) return '';
      const cible = w.go ? (PAGES.find(x=>x.id===w.go)||{}).t : null;
      const vis = w.img ? `<img src="${w.img}" alt="">` : `<span class="em">${w.e||''}</span>`;
      return `<div class="pcard c-${w.c}">${vis}<span>${w.t}</span>${(cible&&I.fleches)?`<span class="pgo">→ ${cible}</span>`:''}</div>`;
    }).join('');
    return `<section class="psheet c-${p.c==='prag'?'pers':p.c}">
      <div class="phead"><b>${p.t}</b><span class="pnum">page ${i+1} / ${pages.length}</span></div>
      <div class="pgrid">${cartes}</div>
      ${I.ops?`<div class="pops">${OPS_PRINT.map(o=>`<div>${o}</div>`).join('')}</div>`:''}
      <div class="pfoot"><span>Adaptparole${settings.prenom?' · classeur de '+settings.prenom:''}</span><span>${p.t}</span></div>
    </section>`;
  }).join('');
}

function secImpression(c){
  const I = settings.imp;
  const choisies = I.pages || PAGES.filter(p=>p.id!=='photos'||custom.length).map(p=>p.id);
  const parLigne = Math.max(1, Math.floor(194/(I.mm+3)));
  c.innerHTML = `
  <h1>Imprimer le classeur</h1>
  <p class="lead">Une feuille A4 par page du tableau, dans le même ordre et avec les mêmes couleurs que l'écran. À plastifier et à relier : l'élève garde ainsi le même outil quand l'iPad est éteint, en récréation ou à la cantine.</p>
  <div class="box" style="max-width:700px">
    <label class="f" for="pS">Taille des images : <b id="pSv">${I.mm} mm</b> de côté — environ ${parLigne} par ligne</label>
    <input type="range" id="pS" min="25" max="70" step="1" value="${I.mm}" style="width:100%">
    <div class="row"><button class="lvlbtn" data-mm="32">Petites 32 mm</button><button class="lvlbtn" data-mm="42">Moyennes 42 mm</button><button class="lvlbtn" data-mm="55">Grandes 55 mm</button></div>
    <label class="f"><input type="checkbox" id="pO" ${I.ops?'checked':''}> Bandeau des boutons de conduite en bas de chaque feuille</label>
    <label class="f"><input type="checkbox" id="pF" ${I.fleches?'checked':''}> Indiquer vers quelle page mène un démarreur (→ Jouer)</label>
    <label class="f">Pages à imprimer</label>
    <div class="chk">${PAGES.filter(p=>p.id!=='photos'||custom.length).map(p=>
      `<label><input type="checkbox" data-pg="${p.id}" ${choisies.includes(p.id)?'checked':''}> ${p.t} <span class="c">(${p.items.length})</span></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="pGo">Imprimer</button><button class="btn sec" id="pAll">Tout cocher</button><button class="btn sec" id="pNone">Tout décocher</button></div>
    <p class="c" style="margin-top:8px">Dans la fenêtre d'impression, laissez les marges par défaut et activez « graphiques d'arrière-plan » pour conserver les couleurs.</p>
  </div>
  <h2>Aperçu</h2>
  <div class="apercu" id="pPrev" style="--ps:${I.mm}mm"></div>`;
  const maj = () => { settings.imp=I; save('settings',settings); $('#pSv').textContent=I.mm+' mm';
    $('#pPrev').style.setProperty('--ps', I.mm+'mm'); $('#pPrev').innerHTML=feuilles(); };
  $('#pS').oninput = e => { I.mm=+e.target.value; maj(); };
  c.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ I.mm=+b.dataset.mm; $('#pS').value=I.mm; maj(); secImpression(c); });
  $('#pO').onchange = e => { I.ops=e.target.checked; maj(); };
  $('#pF').onchange = e => { I.fleches=e.target.checked; maj(); };
  const lire = () => { I.pages=[...c.querySelectorAll('[data-pg]')].filter(x=>x.checked).map(x=>x.dataset.pg); maj(); };
  c.querySelectorAll('[data-pg]').forEach(x=>x.onchange=lire);
  $('#pAll').onclick=()=>{ c.querySelectorAll('[data-pg]').forEach(x=>x.checked=true); lire(); };
  $('#pNone').onclick=()=>{ c.querySelectorAll('[data-pg]').forEach(x=>x.checked=false); lire(); };
  $('#pGo').onclick=()=>{
    if(!(I.pages||[1]).length){ toast('Cochez au moins une page'); return; }
    $('#printout').style.setProperty('--ps', I.mm+'mm');
    $('#printout').innerHTML = feuilles();
    document.body.classList.add('printing');
    setTimeout(()=>{ window.print(); setTimeout(()=>document.body.classList.remove('printing'),500); }, 150);
  };
  maj();
}

function secReglages(c){
  c.innerHTML = `
  <h1>Réglages</h1>
  <div class="box" style="max-width:640px">
    <label class="f" for="rP">Prénom de l'élève</label><input type="text" id="rP" value="${settings.prenom}">
    <label class="f" for="rT">Taille des images</label>
    <select id="rT"><option value="s">Petites (plus de mots par page)</option><option value="m">Moyennes</option><option value="l">Grandes (motricité fine fragile)</option></select>
    <label class="f" for="rR">Vitesse de la voix</label><input type="range" id="rR" min="0.6" max="1.2" step="0.05" value="${settings.rate}"> <button class="pill" id="rTest">Tester</button>
    <label class="f"><input type="checkbox" id="rL" ${settings.lireToucher?'checked':''}> Prononcer chaque image au toucher</label>
    <label class="f"><input type="checkbox" id="rA" ${settings.aideAdulte?'checked':''}> Afficher l'aide à l'adulte après « Dire »</label>
    <label class="f"><input type="checkbox" id="rV" ${settings.verrou?'checked':''}> Appui long pour ouvrir l'espace adulte</label>
  </div>
  <div class="box" style="max-width:640px">
    <h3>Albert, l'IA de l'État</h3>
    <label class="f"><input type="checkbox" id="rI" ${settings.albert?'checked':''}> Utiliser Albert quand le réseau est disponible</label>
    <label class="f" for="rU">Adresse du relais</label><input type="text" id="rU" value="${settings.relais}" style="width:100%" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:10px"><button class="btn sec" id="rIT">Tester la connexion</button><span id="rIE" class="c"></span></div>
    <p class="c" style="margin-top:8px">La clé reste dans le relais Cloudflare, jamais sur l'appareil. Sans réseau, l'application utilise son moteur intégré.</p>
  </div>
  <p class="lead">Les données restent dans ce navigateur, sur cet appareil. L'application fonctionne hors connexion une fois la page ouverte.</p>`;
  $('#rT').value=settings.taille;
  const upd=()=>{ settings.prenom=$('#rP').value.trim(); settings.taille=$('#rT').value; settings.rate=+$('#rR').value;
    settings.lireToucher=$('#rL').checked; settings.albert=$('#rI').checked; settings.relais=$('#rU').value.trim()||RELAIS_DEFAUT; settings.aideAdulte=$('#rA').checked; settings.verrou=$('#rV').checked; save('settings',settings); applySettings(); };
  c.querySelectorAll('input,select').forEach(i=>i.addEventListener('change',upd));
  $('#rIT').onclick=async()=>{ upd(); const e=$('#rIE');
    if(!navigator.onLine){ e.textContent='Pas de réseau.'; return; }
    e.textContent='Test en cours…';
    try{ const r=await reponseAlbert('voiture rouler',['voiture','rouler'],false); e.textContent='✓ Albert répond : « '+r.reform+' »'; }
    catch(x){ e.textContent='✗ '+x.message; } };
  $('#rTest').onclick=()=>{ upd(); speak('Je veux la voiture rouge.'); };
}

function secSources(c){
  c.innerHTML = `
  <h1>Sur quoi s'appuie l'application</h1>
  <ul class="src prose">
    <li><b>Interventions naturalistes développementales et comportementales (NDBI, dont EMT et JASPER).</b> Méta-analyse récente (29 études, 517 enfants) : effets positifs sur le langage ; associer la CAA à l'intervention naturaliste tend à donner de meilleurs résultats chez les enfants au langage très limité.</li>
    <li><b>Enhanced Milieu Teaching (EMT).</b> Suivre l'initiative de l'enfant, répondre avec le langage cible, reformuler en enrichissant, aménager l'environnement, utiliser modèles, délais et aides graduées.</li>
    <li><b>NICE (Royaume-Uni).</b> Interventions de communication fondées sur le jeu, visant attention conjointe, engagement et réciprocité, adaptées au niveau de l'enfant et impliquant parents et enseignants.</li>
    <li><b>ASHA, troubles du langage oral chez l'enfant d'âge préscolaire.</b> Élargir le vocabulaire (verbes, pronoms, connecteurs, concepts de base), allonger et complexifier les phrases, diversifier les types de phrases.</li>
    <li><b>Écholalie.</b> Revue de 2025 : beaucoup d'interventions visaient à réduire l'écholalie, peu montraient une augmentation de la communication spontanée ; l'écholalie peut avoir une fonction communicative ou d'autorégulation.</li>
    <li><b>GLP / NLA.</b> Revue systématique fin 2024 (18 bases, 3 registres d'essais) : aucune étude empirique d'efficacité ; analyse critique 2024 : modèle théorique insuffisamment étayé.</li>
    <li><b>PODD</b> (Gayle Porter) : organisation pragmatique du vocabulaire. L'application s'inspire de ses principes sans reproduire un classeur PODD.</li>
    <li><b>Code couleur</b> inspiré de la clé de Fitzgerald modifiée : personnes jaune, actions vert, descriptions bleu, choses orange, petits mots violet, mots sociaux rose.</li>
  </ul>`;
}

registerCustom(); applySettings(); renderPage(); renderStrip();
